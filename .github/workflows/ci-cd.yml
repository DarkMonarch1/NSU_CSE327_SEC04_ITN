name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (API & RDS Worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            services/api/package-lock.json
            services/rds-worker/package-lock.json

      - name: Test & Typecheck API Service
        working-directory: services/api
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test & Typecheck RDS Worker
        working-directory: services/rds-worker
        run: |
          npm ci
          npm run typecheck
          npm test

  web-ci:
    name: Web App CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint web application
        working-directory: apps/web
        run: npm run lint

      - name: Build web application
        working-directory: apps/web
        run: npm run build

  mobile-ci:
    name: Mobile App CI (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter codebase
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f infrastructure/docker-compose.yml config

      - name: Build API Docker Image
        run: docker build -t smartadvisor-api:smoke -f services/api/Dockerfile services/api
