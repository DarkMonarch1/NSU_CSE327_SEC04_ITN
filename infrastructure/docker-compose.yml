services:
  postgres:
    image: postgres:16-alpine
    container_name: smartadvisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartadvisor
      POSTGRES_PASSWORD: smartadvisor_secret
      POSTGRES_DB: smartadvisor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartadvisor -d smartadvisor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartadvisor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: smartadvisor-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://smartadvisor:smartadvisor_secret@postgres:5432/smartadvisor_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
